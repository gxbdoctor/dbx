name: Build Virtual Groups Windows

on:
  push:
    branches:
      - feature/virtual-groups
    paths:
      - .github/workflows/virtual-groups-windows.yml

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/virtual-groups

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable updater artifacts for unsigned test build
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding UTF8 src-tauri/tauri.virtual-groups.conf.json

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.virtual-groups.conf.json

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DBX-Virtual-Groups-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
