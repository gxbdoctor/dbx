name: Verify Virtual Groups

on:
  push:
    branches:
      - feature/virtual-groups
    paths:
      - .github/workflows/virtual-groups-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/virtual-groups
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Full frontend test suite
        run: pnpm test
      - name: Frontend build
        run: pnpm build
